<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d5a27; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <svg width="260" height="340" viewBox="0 0 260 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower">
    <!-- stem -->
    <path d="M130 150 C125 210 138 260 130 330" stroke="#3b8a3b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M132 260 C170 235 200 240 215 255 C190 275 155 275 132 260 Z" fill="#4caf50"/>
    <path d="M128 220 C95 195 65 200 50 215 C72 238 105 238 128 220 Z" fill="#4caf50"/>
    <!-- petals -->
    <g transform="translate(130 100)" fill="#ff7eb6" stroke="#e0508f" stroke-width="2">
      <ellipse cx="0" cy="-45" rx="22" ry="40"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(45)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(90)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(135)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(180)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(225)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(270)"/>
      <ellipse cx="0" cy="-45" rx="22" ry="40" transform="rotate(315)"/>
    </g>
    <!-- center -->
    <circle cx="130" cy="100" r="24" fill="#ffd54a" stroke="#e0a800" stroke-width="3"/>
  </svg>
</body>
</html>
